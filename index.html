<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaymonMontage | Переезд</title>
    
    <!-- Подключаем шрифт как на новом сайте -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Темная тема и Оранжевый акцент */
        :root {
            --bg: #0f0f11;
            --primary: #f97316;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Аватарка кота (берется с нового сайта) */
        .avatar {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 0 20px rgba(249, 115, 22, 0.4));
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .highlight {
            color: var(--primary);
            font-weight: 900;
        }

        /* Полоса загрузки */
        .loader-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .loader-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 10px;
            /* Анимация заполнения за 3 секунды */
            animation: fillBar 3s ease-in-out forwards;
            box-shadow: 0 0 10px var(--primary);
        }

        p {
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        .link {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
            transition: 0.3s;
        }
        .link:hover { color: white; border-color: white; }

        /* Анимации */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Адаптив */
        @media (max-width: 500px) {
            .loader-container { width: 80%; }
            .avatar { width: 100px; height: 100px; }
        }
    </style>

    <!-- Автоматический редирект через мета-тег (как страховка на 4 секунды) -->
    <meta http-equiv="refresh" content="4;url=https://daymonmontage.github.io/daymon-site/">
</head>
<body>

    <!-- Картинка тянется с НОВОГО сайта, чтобы не грузить файлы -->
    <img src="https://daymonmontage.github.io/daymon-site/assets/avatar.png" alt="Daymon" class="avatar">

    <h1>
        МЫ <span class="highlight">ПЕРЕЕХАЛИ</span>!
    </h1>

    <div class="loader-container">
        <div class="loader-bar"></div>
    </div>

    <p>Перенаправление на новую базу...</p>
    <p style="font-size: 0.8rem; margin-top: 20px;">
        Если ничего не происходит, <a href="https://daymonmontage.github.io/daymon-site/" class="link">жми сюда</a>
    </p>

    <script>
        // Скрипт для плавного перехода
        setTimeout(() => {
            // Перекидываем пользователя на новый сайт через 3.5 секунды
            window.location.href = "https://daymonmontage.github.io/daymon-site/";
        }, 3200);
    </script>

</body>
</html>
